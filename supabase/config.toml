project_id = "academie-shinigami-rp"

[auth]
site_url = "https://ricardoalbertopro-gif.github.io/academie-shinigami-rp/"
additional_redirect_urls = ["https://ricardoalbertopro-gif.github.io/academie-shinigami-rp/admin.html"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.submit-exam]
verify_jwt = false

[functions.manage-admin]
verify_jwt = true

[functions.claim-owner]
verify_jwt = true
